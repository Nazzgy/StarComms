name: Publish StarComms 1.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-1.0.yml']
permissions:
  contents: write
concurrency: release-v1.0
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/releases/455822554"
          gh api "$endpoint" | jq -e '.tag_name == "v1.0" and .target_commitish == "ed793074f63ffd15d2d13deae6f57eff678cbf26" and (.assets | length == 1) and .assets[0].name == "StarComms.exe" and .assets[0].digest == "sha256:2d4c78fe69f0354c3cebaa63e4ffef925714cda343f7bb1faf768b92a2cfe489"'
          if [ "$(gh api "$endpoint" --jq .draft)" = true ]; then
            gh api --method PATCH "$endpoint" -F draft=false --silent
          fi
          gh api "$endpoint" | jq -e '.draft == false and .published_at != null'
          gh api "$endpoint" --jq .body > notes.md
          if ! grep -Fq 'Se StarComms se celá flotila' notes.md; then
            cat > intro.md <<'INTRO'
          **Se StarComms se celá flotila nemusí překřikovat v jednom hlasovém kanálu na Discordu.** Každá loď má vlastní kanál pro posádku a kapitáni mají navíc společný kanál pro koordinaci flotily.
          
          Třeba při salvage operaci se posádka Reclaimeru domlouvá, který vrak rozebere jako první. Ve stejnou chvíli se piloti stíhaček na kapitánském kanálu dohodnou, kdo bude Reclaimer krýt. Oba hovory můžou běžet současně.
          INTRO
            { cat intro.md; echo; cat notes.md; } > updated.md
            gh api --method PATCH "$endpoint" -F body=@updated.md --silent
          fi
          gh api "$endpoint" --jq .body > notes.md
          if ! grep -Fq 'Flotilu hostuje jeden z hráčů' notes.md; then
            awk '/^StarComms 1\.0 \(/ {print "Flotilu hostuje jeden z hráčů přímo ve StarComms na svém PC. V aplikaci vybere **Chci hostovat** a pošle ostatním pozvánku. Ti ji vloží do StarComms a připojí se. Samostatný server skupina nepotřebuje."; print ""} {print}' notes.md > updated.md
            grep -Fq 'Flotilu hostuje jeden z hráčů' updated.md
            gh api --method PATCH "$endpoint" -F body=@updated.md --silent
          fi
